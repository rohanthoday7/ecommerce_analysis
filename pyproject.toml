[project]
name = "dataverse"
version = "1.0.0"
description = "Dataverse Enterprise E-Commerce Business Analytics Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.6"
]

[tool.vercel]
entrypoint = "backend.app:app"
